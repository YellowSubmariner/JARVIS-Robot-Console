name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install application and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --distpath . JARVIS.spec

      - name: Upload Windows application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JARVIS-Robot-Console-v0.1.0-windows-x64
          path: Windows/
          if-no-files-found: error
          retention-days: 14
